[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sp-attt"
version = "0.1.0"
description = "Selective Plasticity for Agentic Test-Time Training"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pyyaml>=6.0", "torch>=2.1"]

[project.optional-dependencies]
train = ["transformers>=4.51", "peft>=0.15", "accelerate>=1.4", "safetensors>=0.5"]
analysis = ["pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.8"]
alfworld = ["alfworld>=0.4.2"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
sp-attt = "sp_attt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sp_attt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

